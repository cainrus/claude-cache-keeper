name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Node version
        run: node --version
      - name: Syntax check
        run: for f in bin/*.ts src/*.ts; do node --check "$f"; done
      - name: Smoke
        run: |
          node bin/cache-keeper.ts --help
          node bin/cache-keeper.ts install-snippet > /dev/null
      - name: Test
        run: npm test

  plugin:
    name: claude plugin validate (Claude Code ${{ matrix.claude }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pinned: a new release may add checks. Bump it on purpose, after a local run.
        claude: ['2.1.316']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      - name: Validate
        env:
          CACHE_KEEPER_REQUIRE_CLAUDE: '1'
        run: node --test test/plugin.test.ts
