name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Node version
        run: node --version
      - name: Syntax check
        run: for f in bin/*.ts src/*.ts; do node --check "$f"; done
      - name: Smoke
        run: |
          node bin/cache-keeper.ts --help
          node bin/cache-keeper.ts install-snippet > /dev/null
      - name: Test
        run: npm test
